<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Pecah Perkalian & Number Bond Interaktif</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .game-container {
            max-width: 550px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2e7d32;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .score-board {
            font-size: 16px;
            font-weight: bold;
            color: #555;
            margin-bottom: 15px;
        }
        
        .math-problem-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
        }
        .question-box {
            font-size: 28px;
            font-weight: bold;
            color: #1f2937;
        }
        
        /* NUMBER BOND DIGESER KE KIRI DI SINI */
        .number-bond-container {
            position: relative;
            width: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 5px;
            margin-left: -110px; /* Atur besar minusnya jika ingin lebih/kurang ke kiri */
        }
        
        .bond-circles {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: -2px;
        }
        
        /* DIJAMIN BENTUK LINGKARAN SEMPURNA */
        .circle-input {
            width: 52px !important;
            height: 52px !important;
            min-width: 52px;
            min-height: 52px;
            border: 3px solid #388e3c !important;
            border-radius: 50% !important;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #d32f2f;
            background-color: #f1f8e9;
            outline: none;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            -moz-appearance: textfield;
        }
        .circle-input::-webkit-outer-spin-button,
        .circle-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .circle-input:focus {
            border-color: #1b5e20 !important;
            background-color: #fff;
        }

        .lines-svg {
            width: 220px;
            height: 35px;
        }

        .breakdown-section {
            display: flex;
            justify-content: center;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin: 25px 0 15px 0;
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .input-group label {
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
            font-weight: 600;
        }
        input[type="number"] {
            width: 75px;
            padding: 8px;
            font-size: 16px;
            text-align: center;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="number"]:focus {
            border-color: #2e7d32;
        }
        button {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #1b5e20;
        }
        #feedback {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
        }
        .correct { color: #2e7d32; }
        .incorrect { color: #d32f2f; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>Math Fun: Pecah Angka</h1>
    <div class="score-board">Soal <span id="current-q-num">1</span> dari 10 | Skor: <span id="score">0</span></div>
    
    <div class="math-problem-area">
        <div class="question-box" id="question-text">Loading...</div>
        
        <div class="number-bond-container" id="bond-container">
            <svg class="lines-svg" viewBox="0 0 220 35" id="bond-lines">
                <!-- Garis cabang SVG -->
            </svg>
            <div class="bond-circles" id="bond-circles-container">
                <!-- Lingkaran input kosong -->
            </div>
        </div>
    </div>
    
    <div class="breakdown-section" id="inputs-container">
        <!-- Input dinamis perkalian distributif -->
    </div>

    <button id="submit-btn" onclick="checkAnswer()">Jawab</button>
    <div id="feedback"></div>
</div>

<script>
    let score = 0;
    let questionIndex = 0;

    const questions = [
        { a: 124, b: 6, decomp: [100, 20, 4], parts: [600, 120, 24], ans: 744 },
        { a: 256, b: 3, decomp: [200, 50, 6], parts: [600, 150, 18], ans: 768 },
        { a: 178, b: 4, decomp: [100, 70, 8], parts: [400, 280, 32], ans: 712 },
        { a: 29, b: 8, decomp: [20, 9], parts: [160, 72], ans: 232 },
        { a: 57, b: 6, decomp: [50, 7], parts: [300, 42], ans: 342 },
        { a: 315, b: 5, decomp: [300, 10, 5], parts: [1500, 50, 25], ans: 1575 },
        { a: 84, b: 7, decomp: [80, 4], parts: [560, 28], ans: 588 },
        { a: 423, b: 2, decomp: [400, 20, 3], parts: [800, 40, 6], ans: 846 },
        { a: 68, b: 9, decomp: [60, 8], parts: [540, 72], ans: 612 },
        { a: 214, b: 5, decomp: [200, 10, 4], parts: [1000, 50, 20], ans: 1070 }
    ];

    let currentQuestion = {};

    function loadQuestion() {
        if (questionIndex >= questions.length) {
            document.querySelector('.game-container').innerHTML = `
                <h1 style="color: #2e7d32;">Selamat! 🎉</h1>
                <p style="font-size: 18px; margin: 20px 0;">Kamu telah menyelesaikan semua 10 soal!</p>
                <p style="font-size: 22px; font-weight: bold;">Skor Akhirmu: ${score}</p>
                <button onclick="location.reload()" style="margin-top: 20px;">Main Lagi</button>
            `;
            return;
        }

        currentQuestion = questions[questionIndex];
        document.getElementById('current-q-num').innerText = questionIndex + 1;
        document.getElementById('question-text').innerText = `${currentQuestion.a} × ${currentQuestion.b} = ...`;
        
        let circlesContainer = document.getElementById('bond-circles-container');
        let svgContainer = document.getElementById('bond-lines');
        circlesContainer.innerHTML = '';
        svgContainer.innerHTML = '';

        let decomp = currentQuestion.decomp;
        let count = decomp.length;

        if (count === 3) {
            svgContainer.innerHTML = `
                <line x1="110" y1="0" x2="30" y2="30" stroke="#388e3c" stroke-width="3" />
                <line x1="110" y1="0" x2="110" y2="30" stroke="#388e3c" stroke-width="3" />
                <line x1="110" y1="0" x2="190" y2="30" stroke="#388e3c" stroke-width="3" />
            `;
        } else {
            svgContainer.innerHTML = `
                <line x1="110" y1="0" x2="55" y2="30" stroke="#388e3c" stroke-width="3" />
                <line x1="110" y1="0" x2="165" y2="30" stroke="#388e3c" stroke-width="3" />
            `;
        }

        decomp.forEach((_, index) => {
            let inputCircle = document.createElement('input');
            inputCircle.type = 'number';
            inputCircle.className = 'circle-input';
            inputCircle.id = `decomp-${index}`;
            inputCircle.placeholder = '?';
            circlesContainer.appendChild(inputCircle);
        });

        let container = document.getElementById('inputs-container');
        container.innerHTML = '';
        
        currentQuestion.parts.forEach((_, index) => {
            if (index > 0) {
                let plus = document.createElement('span');
                plus.innerText = '+';
                plus.style.fontSize = '18px';
                plus.style.fontWeight = 'bold';
                plus.style.color = '#555';
                container.appendChild(plus);
            }
            
            let group = document.createElement('div');
            group.className = 'input-group';
            group.innerHTML = `<label id="label-part-${index}">[ ? ] × ${currentQuestion.b}</label><input type="number" id="part-${index}" placeholder="?">`;
            container.appendChild(group);
        });

        let equals = document.createElement('span');
        equals.innerText = '=';
        equals.style.fontSize = '18px';
        equals.style.fontWeight = 'bold';
        equals.style.color = '#555';
        container.appendChild(equals);

        let finalGroup = document.createElement('div');
        finalGroup.className = 'input-group';
        finalGroup.innerHTML = `<label>Total</label><input type="number" id="final-ans" placeholder="Total">`;
        container.appendChild(finalGroup);

        decomp.forEach((_, index) => {
            let decompInput = document.getElementById(`decomp-${index}`);
            decompInput.addEventListener('input', (e) => {
                let val = e.target.value || '?';
                document.getElementById(`label-part-${index}`).innerText = `${val} × ${currentQuestion.b}`;
            });
        });

        document.getElementById('feedback').innerText = '';
    }

    function checkAnswer() {
        let allCorrect = true;
        
        currentQuestion.decomp.forEach((val, index) => {
            let userVal = parseInt(document.getElementById(`decomp-${index}`).value);
            if (userVal !== val) {
                allCorrect = false;
            }
        });

        currentQuestion.parts.forEach((val, index) => {
            let userVal = parseInt(document.getElementById(`part-${index}`).value);
            if (userVal !== val) {
                allCorrect = false;
            }
        });

        let userFinal = parseInt(document.getElementById('final-ans').value);
        if (userFinal !== currentQuestion.ans) {
            allCorrect = false;
        }

        let feedback = document.getElementById('feedback');
        if (allCorrect) {
            feedback.innerText = "Benar! Hebat banget! 🎉";
            feedback.className = "correct";
            score += 10;
            document.getElementById('score').innerText = score;
            questionIndex++;
            setTimeout(loadQuestion, 1500);
        } else {
            feedback.innerText = "Ups, masih ada yang kurang tepat. Coba teliti lagi ya! 💡";
            feedback.className = "incorrect";
        }
    }

    loadQuestion();
</script>

</body>
</html>
